name: Android APK

on:
  workflow_dispatch:
    inputs:
      diagnostic_package:
        description: Build the side-by-side crash-diagnostics edition
        required: false
        default: false
        type: boolean
      release_tag:
        description: Publish a pre-release, for example v0.1.3 (leave blank for a CI build only)
        required: false
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run build-independent tests
        run: bash scripts/test-local.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gettext-base unzip zip

      - name: Build APK
        run: |
          if [[ "${{ inputs.diagnostic_package }}" == "true" ]]; then
            make \
              PACKAGENAME=com.snappercayt.nullnoise.diagnostic \
              LABEL='"NullNoise Diagnostic"' \
              TARGETS="build/makecapk/lib/arm64-v8a/libnullnoise.so build/makecapk/lib/x86_64/libnullnoise.so" \
              CC_x86="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"
          else
            make \
              TARGETS="build/makecapk/lib/arm64-v8a/libnullnoise.so build/makecapk/lib/x86_64/libnullnoise.so" \
              CC_x86="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"
          fi

      - name: Verify APK contents
        run: |
          test -s build/nullnoise.apk
          package_name=com.snappercayt.nullnoise
          if [[ "${{ inputs.diagnostic_package }}" == "true" ]]; then
            package_name=com.snappercayt.nullnoise.diagnostic
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/nullnoise.apk \
            | grep -Fq "package: name='$package_name'"
          unzip -Z1 build/nullnoise.apk | grep -Fxq 'lib/arm64-v8a/libnullnoise.so'
          unzip -Z1 build/nullnoise.apk | grep -Fxq 'lib/x86_64/libnullnoise.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.RECORD_AUDIO'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.INTERNET'; then
            echo "The offline recorder must not request internet access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/nullnoise.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nullnoise-apk
          path: build/nullnoise.apk
          if-no-files-found: error

  emulator-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install emulator image
        run: |
          sdkmanager \
            "platforms;android-35" \
            "system-images;android-35;default;x86_64" \
            "emulator" \
            "platform-tools"

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: nullnoise-apk
          path: build

      - name: Exercise microphone permission and playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/android-playback-smoke.sh build/nullnoise.apk "$APP_PACKAGE"
        env:
          APP_PACKAGE: ${{ inputs.diagnostic_package == true && 'com.snappercayt.nullnoise.diagnostic' || 'com.snappercayt.nullnoise' }}

  release:
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != '' &&
          needs.build.result == 'success' &&
          needs.emulator-smoke.result == 'success' }}
    needs: [build, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: nullnoise-apk
          path: build

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DIAGNOSTIC_PACKAGE: ${{ inputs.diagnostic_package }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version such as v0.1.3"
            exit 1
          fi
          suffix=""
          if [[ "$DIAGNOSTIC_PACKAGE" == "true" ]]; then
            suffix="-diagnostic"
          fi
          cp build/nullnoise.apk "NullNoise-${RELEASE_TAG}${suffix}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NullNoise ${{ inputs.release_tag }}${{ inputs.diagnostic_package == true && ' Diagnostic' || '' }} Prototype
          body: |
            **Prototype build for device testing.**

            ${{ inputs.diagnostic_package == true && 'Diagnostic-only edition. It installs alongside the regular app with separate storage, so record a fresh clip in this edition. This build does not fix playback. The Android 15 emulator smoke test covers the app flow, but real-device audio behavior is not validated.' || 'The Android 15 emulator smoke test covers microphone permission, recording, enhancement, and original/enhanced playback. Real-device audio quality and vendor-specific behavior have not been validated.' }}

            This debug-signed APK is a prototype, not a production release. Recordings remain in the app’s private storage.
          files: NullNoise-${{ inputs.release_tag }}${{ inputs.diagnostic_package == true && '-diagnostic' || '' }}.apk
          prerelease: true
