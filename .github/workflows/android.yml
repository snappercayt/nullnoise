name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gettext-base unzip zip

      - name: Build APK
        run: make

      - name: Verify APK contents
        run: |
          test -s build/nullnoise.apk
          unzip -Z1 build/nullnoise.apk | grep -Fxq 'lib/arm64-v8a/libnullnoise.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.RECORD_AUDIO'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.INTERNET'; then
            echo "The offline recorder must not request internet access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/nullnoise.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nullnoise-apk
          path: build/nullnoise.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: nullnoise-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NullNoise ${{ github.ref_name }} Prototype
          body: |
            **Prototype build for device testing.**

            Recording, playback, and noise suppression have not yet been validated on physical Android devices. This debug-signed APK is not a production release.
          files: dist/nullnoise.apk
          prerelease: true
