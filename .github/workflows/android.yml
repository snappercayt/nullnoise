name: Android APK

on:
  workflow_dispatch:
    inputs:
      diagnostic_package:
        description: Build the side-by-side crash-diagnostics edition
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run build-independent tests
        run: bash scripts/test-local.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "platform-tools"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gettext-base unzip zip

      - name: Build APK
        run: |
          if [[ "${{ inputs.diagnostic_package }}" == "true" ]]; then
            make \
              PACKAGENAME=com.snappercayt.nullnoise.diagnostic \
              LABEL='"NullNoise Diagnostic"' \
              TARGETS="build/makecapk/lib/arm64-v8a/libnullnoise.so build/makecapk/lib/x86_64/libnullnoise.so" \
              CC_x86="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"
          else
            make \
              TARGETS="build/makecapk/lib/arm64-v8a/libnullnoise.so build/makecapk/lib/x86_64/libnullnoise.so" \
              CC_x86="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"
          fi

      - name: Verify APK contents
        run: |
          test -s build/nullnoise.apk
          package_name=com.snappercayt.nullnoise
          if [[ "${{ inputs.diagnostic_package }}" == "true" ]]; then
            package_name=com.snappercayt.nullnoise.diagnostic
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/nullnoise.apk \
            | grep -Fq "package: name='$package_name'"
          unzip -Z1 build/nullnoise.apk | grep -Fxq 'lib/arm64-v8a/libnullnoise.so'
          unzip -Z1 build/nullnoise.apk | grep -Fxq 'lib/x86_64/libnullnoise.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.RECORD_AUDIO'
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions build/nullnoise.apk \
            | grep -Fq 'android.permission.INTERNET'; then
            echo "The offline recorder must not request internet access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/nullnoise.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: nullnoise-apk
          path: build/nullnoise.apk
          if-no-files-found: error

  emulator-smoke:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.diagnostic_package != true)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install emulator image
        run: |
          sdkmanager \
            "platforms;android-30" \
            "system-images;android-30;default;x86_64" \
            "emulator" \
            "platform-tools"

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: nullnoise-apk
          path: build

      - name: Exercise microphone permission and playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/android-playback-smoke.sh build/nullnoise.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: nullnoise-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NullNoise ${{ github.ref_name }} Prototype
          body: |
            **Prototype build for device testing.**

            Android emulator smoke tests cover microphone permission, recording, enhancement, and original/enhanced playback. Real-device audio quality and vendor-specific behavior have not been validated. This debug-signed APK is not a production release.
          files: dist/nullnoise.apk
          prerelease: true
